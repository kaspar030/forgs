[workspace]
resolver = "2"
# forgs-http joins this list as it lands (docs/design.md §5).
members = [
    "crates/forgs",
    "crates/forgs-client",
    "crates/forgs-idp",
    "crates/forgs-store",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
forgs = { path = "crates/forgs" }
forgs-client = { path = "crates/forgs-client" }
forgs-idp = { path = "crates/forgs-idp" }
forgs-store = { path = "crates/forgs-store" }

# Dependency discipline (carried over from probe-rs-fleet):
#
# * Pure Rust only. fleet's agent cross-compiles to armv7-musl and consumes
#   forgs-client, so nothing in the graph may need a C toolchain.
# * Crypto goes through `ring` (for TLS: the rustls `ring` provider), never
#   `aws-lc-rs`, which pulls a C crypto build that fails to cross-compile to
#   armv7-musl.
# * `default-features = false` wherever a crate's defaults drag in more than
#   is used, so every feature in the tree is one somebody asked for.
# * The core `forgs` crate is pure: no IO, no async runtime (tokio is a
#   dev-dependency only), no clock (`now` is always a parameter).
# * The one sanctioned exception to "no C toolchain" is `sqlx`'s `sqlite`
#   feature, which builds a bundled libsqlite3. It is acceptable **only** in
#   server-side crates (forgs-store, forgs-http): `forgs` and `forgs-client`
#   must never depend on forgs-store, so the armv7-musl agent build never sees
#   it.

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
rand_core = "0.6"
thiserror = "2"
async-trait = "0.1"
# `default-features = false` and no features: ulid's `std` feature (which its
# `serde` feature needs) pulls rand 0.9, a second RNG stack. forgs builds ids
# with `Ulid::from_parts(now_ms, random)` from `rand_core::OsRng` instead, and
# implements serde for its id newtypes by hand.
ulid = { version = "1.2", default-features = false }

# HTTPS egress (forgs-idp's `client` feature). Everything pinned to
# `default-features = false` and the rustls `ring` provider; see above.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = { version = "0.1", default-features = false }
http = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `rust_crypto`, not `aws_lc_rs`: the same cross-compilation reason as rustls.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Storage (forgs-store). No `macros` / `migrate`: queries are runtime-checked
# (the crate builds without a live database) and forgs runs its own migrator
# so apps keep `_sqlx_migrations` to themselves.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# dev / test helpers
# Test certificates for forgs-client's pinned-TLS test; `ring`, not aws-lc.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
