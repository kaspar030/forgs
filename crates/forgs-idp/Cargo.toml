[package]
name = "forgs-idp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "forgs identity providers: GitHub (OAuth2), generic OIDC with Codeberg/Forgejo and GitLab presets, and GitHub Actions workload identity."

[dependencies]
forgs.workspace = true

serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# `client` feature: HTTPS egress to the providers. Off by default so the pure
# parsers and types build without an async runtime or a TLS stack.
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
http = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time", "net", "sync"] }
tracing = { workspace = true, optional = true }

# `oidc` feature: JWT verification (id tokens, GitHub Actions workload tokens).
# `jsonwebtoken/rust_crypto` drags in `rsa`, `p256`, `p384`, `ed25519-dalek`;
# a runner-side build that only fetches a workload token needs `client` alone.
jsonwebtoken = { workspace = true, optional = true }

[features]
default = []
client = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:http",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:tokio",
    "dep:tracing",
]
# The pure verifiers. `JwksCache`, `OidcProvider` and `GithubActionsIssuer`
# additionally need `client` and are `#[cfg]`-gated on both.
oidc = ["dep:jsonwebtoken"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
