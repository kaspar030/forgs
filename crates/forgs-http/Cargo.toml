[package]
name = "forgs-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "forgs HTTP surface: axum auth routes, signup, forgs' own device authorization server, cookies and CSRF."

# Server-side only. The app owns the listener (no axum `tokio`/`http1`
# features here) and nests `forgs_http::router` into its own Router.
[dependencies]
forgs.workspace = true
forgs-store.workspace = true
# `oidc` for the pure `WorkloadIssuer` trait only; the app enables `client`
# itself if it wants the real GitHub Actions issuer.
forgs-idp = { workspace = true, features = ["oidc"] }

axum.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
serde_urlencoded.workspace = true
base64.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true
http-body-util.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true

[lints]
workspace = true
