# cargo-deny configuration. CI (.github/workflows/audit.yml) only runs
# `cargo deny check advisories`; licenses/bans/sources are not gated.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack) comes in via jsonwebtoken rust_crypto; forgs uses it only for RS256 signature VERIFICATION with public keys, never private-key decrypt/sign, so it is not exploitable. No fixed rsa release yet." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (non-constant-time ops) comes in via jsonwebtoken rust_crypto -> p256/p384 0.13 -> elliptic-curve 0.13; forgs uses it only to VERIFY ES256/ES384 signatures with public keys (EncodingKey/encode appear only in #[cfg(test)] code, with HMAC/RSA), so no secret scalars pass through crypto-bigint. jsonwebtoken 11.1.0 (latest) still pins p256 ^0.13. Remove once jsonwebtoken moves to elliptic-curve 0.14 / crypto-bigint 0.7." },
]
